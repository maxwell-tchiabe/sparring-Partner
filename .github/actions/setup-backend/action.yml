name: Setup backend
description: Set up Python, uv, and locked backend dependencies

inputs:
  python-version:
    description: Python version to use
    required: false
    default: "3.12"

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        version: latest

    - name: Install backend dependencies
      working-directory: backend
      shell: bash
      run: uv sync --frozen
