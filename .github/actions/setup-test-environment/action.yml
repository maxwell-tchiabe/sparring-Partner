name: Setup test environment
description: Configure fake credentials for backend tests

runs:
  using: composite
  steps:
    - name: Configure test environment variables
      shell: bash
      run: |
        {
          echo "PYTHONPATH=src"
          echo "SUPABASE_URL=http://localhost:54321"
          echo "SUPABASE_JWT_SECRET=test-jwt-secret"
          echo "SUPABASE_KEY=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRlc3QifQ.c2lnbmF0dXJl"
          echo "GROQ_API_KEY=test-groq-key"
          echo "ELEVENLABS_API_KEY=test-elevenlabs-key"
          echo "ELEVENLABS_VOICE_ID=test-voice-id"
          echo "TOGETHER_API_KEY=test-together-key"
          echo "QDRANT_URL=http://localhost:6333"
          echo "QDRANT_API_KEY=test-qdrant-key"
        } >> "$GITHUB_ENV"
