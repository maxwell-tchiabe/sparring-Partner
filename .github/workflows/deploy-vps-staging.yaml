name: Deploy Backend to VPS (Staging)

on:
  push:
    branches:
      - staging
    paths:
      - "backend/**"
      - ".github/workflows/deploy-vps-staging.yaml"

env:
  IMAGE_NAME: ghcr.io/maxwell-tchiabe/sparring-partner-api

jobs:
  unit-tests:
    name: Run backend unit tests
    runs-on: ubuntu-latest
    env:
      # Unit tests use mocked services but some modules load settings at import time.
      SUPABASE_URL: http://localhost:54321
      SUPABASE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRlc3QifQ.c2lnbmF0dXJl
      GROQ_API_KEY: test-groq-key
      ELEVENLABS_API_KEY: test-elevenlabs-key
      ELEVENLABS_VOICE_ID: test-voice-id
      TOGETHER_API_KEY: test-together-key
      QDRANT_URL: http://localhost:6333
      QDRANT_API_KEY: test-qdrant-key

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: latest

      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --frozen

      - name: Run unit tests
        working-directory: backend
        env:
          PYTHONPATH: src
        run: uv run python -m unittest discover -s tests -v

  build-and-push:
    name: Build & Push Docker Image
    needs: unit-tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:staging
            ${{ env.IMAGE_NAME }}:${{ github.sha }}

  deploy:
    name: Deploy to VPS
    needs: build-and-push
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Copy deployment files via scp
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT }}
          source: "backend/docker-compose.staging.yml,backend/docker-compose.monitoring.yml,backend/monitoring"
          target: "/opt/sparring-partner/"
          strip_components: 1

      - name: Execute deployment commands via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT}}
          script: |
            mkdir -p /opt/sparring-partner/short_term_memory
            cd /opt/sparring-partner/
            
            mv docker-compose.staging.yml docker-compose.yml
            
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            
            export IMAGE_TAG=${{ github.sha }}
            
            docker network create monitoring || true
            docker compose -f docker-compose.monitoring.yml pull
            docker compose -f docker-compose.monitoring.yml up -d
            
            docker compose pull
            docker compose up -d
            
            docker image prune -af
